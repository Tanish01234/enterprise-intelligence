version: '3.8'

services:
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: ei-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ei-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Local Supabase stack for full parity
  # supabase:
  #   image: supabase/supabase:latest
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
  #     ANON_KEY: ${ANON_KEY}
  #     SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

volumes:
  postgres_data:
  redis_data: